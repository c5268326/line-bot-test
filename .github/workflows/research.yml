name: 回測研究

on:
  workflow_dispatch:
    inputs:
      script:
        description: "要執行的研究程式(research/ 底下的檔名)"
        required: true
        default: "probe_sources.py"
      only_datasets:
        description: "只抓指定的 FinMind dataset(逗號分隔,留空為全部)"
        required: false
        default: ""
      universe_size:
        description: "universe 檔數"
        required: false
        default: "120"
      years:
        description: "只抓指定年份(逗號分隔,留空為全部)"
        required: false
        default: ""
      add_stocks:
        description: "要加進檢測站的個股代號(逗號分隔,如 4939,6735)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install requests pandas numpy certifi

      - name: 執行研究程式
        env:
          ONLY_DATASETS: ${{ inputs.only_datasets }}
          UNIVERSE_SIZE: ${{ inputs.universe_size }}
          FINMIND_PACE: "2.0"
          YEARS: ${{ inputs.years }}
          ADD_STOCKS: ${{ inputs.add_stocks }}
        run: python "research/${{ inputs.script }}"

      - name: 提交產出結果
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/data research/output docs/data 2>/dev/null || true
          git diff --cached --quiet || git commit -m "回測研究產出 $(TZ='Asia/Taipei' date '+%Y/%m/%d %H:%M')"
          # 推回這次執行的那個分支,不是寫死 main。
          # 原本寫死 main:在功能分支上跑時 rebase 會衝突 → detached HEAD → push 失敗,
          # 整輪抓到的資料就這樣沒了(抓資料吃 API 配額,重跑成本很高)。
          BR="${GITHUB_REF_NAME}"
          git pull --rebase --autostash origin "$BR" || true
          git push origin "HEAD:$BR" || true
