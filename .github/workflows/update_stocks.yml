name: 每日更新股市資料

# 排程只會從**預設分支**執行(GitHub 的規則),所以這個檔案要在 main 上
# 才會真的自動跑。放在功能分支上只有 workflow_dispatch 有效。

on:
  workflow_dispatch:

  schedule:
    # 兩個時段,都是 UTC。台灣 = UTC+8。
    #
    # 21:10 台北(UTC 13:10)週一~週五:收盤後跑,拿得到當日日線、
    #   三大法人、本益比。
    # 09:10 台北(UTC 01:10)週二~週六:回頭補前一個交易日的融資餘額。
    #
    # 為什麼要兩次:證交所各項資料公布時間不同。實測(本專案自己量的):
    #   16:34 台北 → 融資 2 檔、評價 0 檔      (都還沒出來)
    #   20:14 台北 → 融資 2 檔、評價 666 檔    (評價出來了,融資還沒)
    # 融資餘額當晚拿不到,隔天早上一定有。fetch_chips 每次都重抓最近
    # 30 個交易日,所以第二趟會自動把前一天補齊 —— 不需要額外的補洞邏輯。
    - cron: "10 13 * * 1-5"
    - cron: "10 1 * * 2-6"

# 同時只跑一個,而且不砍進行中的:抓資料吃 API 配額,砍掉重練很貴
concurrency:
  group: update-stocks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install requests certifi

      # 1) 日線。非交易日會明說「非交易日」,請求失敗會明說失敗 ——
      #    兩者混為一談就是 2026-09-07 在 672 檔裡消失的原因。
      - name: 更新日線
        run: python research/update_quotes.py

      # 2) 補洞。看每個日期的覆蓋率,某天遠低於中位數就重抓那天。
      #    自動排程一定會遇到網路抖動,沒有這一步洞會永遠留著:
      #    回補視窗是從最後日期往後算的,補不到中間。
      - name: 補回整天缺掉的交易日
        run: python research/repair_quotes.py

      # 3) 籌碼。走證交所/櫃買全市場日報,每天 5 個 request 涵蓋所有個股。
      - name: 更新籌碼
        run: python research/fetch_chips.py

      # 4) 財報續抓。FinMind 配額以小時計,一輪約 95 檔;跑完就是 no-op。
      #    只在早上那一趟跑,避免和籌碼搶同一小時的配額。
      - name: 續抓財報
        if: github.event.schedule == '10 1 * * 2-6' || github.event_name == 'workflow_dispatch'
        run: python research/fetch_financials.py
        continue-on-error: true

      - name: 提交並推送
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "資料沒有變化(可能是非交易日),不提交"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          python3 -c "import json; d=json.load(open('docs/data/stocks.json')); c=json.load(open('docs/data/chips.json')); f=json.load(open('docs/data/financials.json')); n=len(d['stocks']); print('行情', d['dates'][-1], n, '檔 | 籌碼', c['dates'][-1], '| 財報', len(f['stocks']), '/', n)"
          git commit -m "自動更新股市資料 $(TZ='Asia/Taipei' date '+%Y/%m/%d %H:%M')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # 5) 同步到 gh-pages —— 這是網站真正讀到的那份資料。
      #
      #    Pages 用的是「分支來源」模式(deploy from a branch: gh-pages / root),
      #    不是 Actions artifact 模式。會變成這樣是因為 Actions 的 GITHUB_TOKEN
      #    不能「建立」Pages 站台,而推一個 gh-pages 分支會讓 GitHub 自動建站。
      #
      #    index.html 不內嵌資料,它開啟時才去抓同目錄的 data/*.json,
      #    所以「部署」只要讓 gh-pages 上的 JSON 是新的就夠了 ——
      #    不需要重新產生 HTML,也不需要任何人重新發佈什麼。
      #    反過來說:忘了這一步的話,main 的資料再新,網站也不會動。
      - name: 同步到 gh-pages
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/ghp origin/gh-pages

          # 先清空再整份複製,docs/ 刪掉的檔案在網站上才會跟著消失。
          # 用 git rm 而不是 rm -rf:它只動受版控的檔案,不會碰到 .git。
          # 不用 rsync —— runner 上有,但開發時的沙箱沒有,無法在推之前驗。
          cd /tmp/ghp
          git rm -rq .
          cp -a "${GITHUB_WORKSPACE}/docs/." .
          # .nojekyll 只該存在於 gh-pages:關掉 Jekyll,
          # 否則底線開頭的檔案會被它吃掉。上一行清掉了,這裡補回來。
          touch .nojekyll

          # 和 deploy_pages.yml 同一道守門:公開網址上少了任何一個,
          # 這個站就會變成搜尋得到的。寧可不更新,也不要靜悄悄地上線。
          test -f /tmp/ghp/robots.txt || { echo "缺 robots.txt,不同步"; exit 1; }
          grep -q 'name="robots" content="noindex' /tmp/ghp/index.html \
            || { echo "index.html 沒有 noindex,不同步"; exit 1; }

          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages 已經是最新的,不提交"
            exit 0
          fi
          git commit -m "同步網站資料 $(TZ='Asia/Taipei' date '+%Y/%m/%d %H:%M')"
          git push origin HEAD:gh-pages
          echo "已推上 gh-pages,Pages 會自動重新建置"
