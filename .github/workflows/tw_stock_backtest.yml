name: 台股多因子回測

on:
  # 手動觸發，可自訂資料源與回測區間
  workflow_dispatch:
    inputs:
      source:
        description: "資料源 (finmind / yfinance / twse)"
        required: false
        default: "finmind"
      start:
        description: "回測起始日 (YYYY-MM-DD，留空用各策略預設)"
        required: false
        default: ""
      end:
        description: "回測結束日 (YYYY-MM-DD，留空用今天)"
        required: false
        default: ""

  # 每週一台灣時間 09:00（UTC 01:00）自動跑一次，抓最新資料重新回測
  schedule:
    - cron: "0 1 * * 1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 1  # 三組預設依序跑，避免同時 push 造成衝突
      matrix:
        preset: [default, long_term, short_term]
      fail-fast: false

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tw_stock_backtest/requirements.txt

      - name: 安裝套件
        run: pip install -r tw_stock_backtest/requirements.txt

      - name: 決定回測區間
        id: dates
        run: |
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          if [ -z "$END" ]; then END=$(date -u +%F); fi
          if [ -z "$START" ]; then
            if [ "${{ matrix.preset }}" = "short_term" ]; then
              START=$(date -u -d '6 months ago' +%F)
            else
              START="2015-01-01"
            fi
          fi
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"

      - name: 執行回測（${{ matrix.preset }}）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python -m tw_stock_backtest.run_backtest \
            --source "${{ github.event.inputs.source || 'finmind' }}" \
            --preset "${{ matrix.preset }}" \
            --start "${{ steps.dates.outputs.start }}" \
            --end "${{ steps.dates.outputs.end }}" \
            --output-dir "tw_stock_backtest/results/${{ matrix.preset }}"

      - name: 寫入 Job Summary
        if: always()
        run: |
          REPORT="tw_stock_backtest/results/${{ matrix.preset }}/report.json"
          if [ -f "$REPORT" ]; then
            echo "### ${{ matrix.preset }} 回測結果" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 提交並推送回測結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "tw_stock_backtest/results/${{ matrix.preset }}"
          git diff --cached --quiet || git commit -m "台股回測(${{ matrix.preset }})更新 $(TZ='Asia/Taipei' date '+%Y/%m/%d %H:%M')"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
