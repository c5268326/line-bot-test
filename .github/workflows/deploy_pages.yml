name: 部署檢測站到 GitHub Pages

# ⚠⚠ 啟用前先讀這段:這個 repo 是公開的(visibility: public)。
#
# 一旦啟用 Pages,https://c5268326.github.io/line-bot-test/ 會是**完全公開**的網址,
# 任何人都能開,Google 也會收錄。這和「只有拿到連結的人才能看」是相反的。
# 如果要的是不可被搜尋到的分享連結,請用 artifact,不要用 Pages;
# 真的要用 Pages,建議先把 repo 改成 private(Pages 才會變成需要授權才能看)。
#
# ⚠ 另外,這個 workflow 只能手動觸發。
# 原因:Actions 的預設 GITHUB_TOKEN 沒有「建立 Pages 站台」的權限,
# 第一次執行時 actions/configure-pages 會回報
# 「Create Pages site failed: Resource not accessible by integration」。
# 已確認這不是權限宣告寫漏(pages: write / id-token: write 都在),
# 而是 GITHUB_TOKEN 本身就不能建站,只能在站台存在後部署。
#
# 要啟用,請先到 repo 的 Settings → Pages,把 Source 設成 GitHub Actions,
# 然後把下面 push: 那四行的註解取消,之後 docs/ 一有變動就會自動重新部署
# (包含排程更新 stocks.json 之後的刷新)。
on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "docs/**"
  #     - ".github/workflows/deploy_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署,但不取消進行中的,避免資料更新的部署被砍掉
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 取得程式碼
        # 不指定 ref:workflow_dispatch 會取觸發時選的那個分支。
        # 這是刻意的 —— 資料更新都在功能分支上,main 停在 9/10,
        # 從 main 部署會把兩週前的版本推上線。
        uses: actions/checkout@v4

      - name: 確認要部署的內容是新的
        run: |
          echo "分支: ${GITHUB_REF_NAME}"
          python3 -c "import json; d=json.load(open('docs/data/stocks.json')); c=json.load(open('docs/data/chips.json')); print('行情最新', d['dates'][-1], len(d['dates']), '天', len(d['stocks']), '檔'); print('籌碼最新', c['dates'][-1], len(c['stocks']), '檔')"
          test -f docs/robots.txt || { echo "缺 robots.txt,不部署"; exit 1; }
          grep -q 'name="robots" content="noindex' docs/index.html || { echo "index.html 沒有 noindex,不部署"; exit 1; }
          echo "noindex 與 robots.txt 都在"

      - name: 設定 Pages(尚未啟用時自動啟用)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包 docs 目錄
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
