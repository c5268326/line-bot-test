name: 部署檢測站到 GitHub Pages

# ⚠ 這個 workflow 目前是「備用」的,平常不會跑,也不該跑。
#
# Pages 實際上是用**分支來源**在運作:gh-pages 分支的根目錄。
# 會變成這樣,是因為 Actions 的預設 GITHUB_TOKEN 不能「建立」Pages 站台
# (第一次執行時 actions/configure-pages 會回報
#  Create Pages site failed: Resource not accessible by integration),
# 而 Pages 的 REST API 又被 agent proxy 擋掉(403)。
# 兩條路都走不到「第一次啟用」。
# 最後是靠「推一個 gh-pages 分支會讓 GitHub 自動建站」這個行為把站台開起來的。
#
# 所以現在的更新路徑是:
#   update_stocks.yml 的「同步到 gh-pages」步驟 → 推 gh-pages → Pages 自動重建
# 不經過這個檔案。
#
# 這個 workflow 用的是另一套機制(Actions artifact + deploy-pages),
# 要用它就必須先到 Settings → Pages 把 Source 從「Deploy from a branch」
# 改成「GitHub Actions」。改了之後 gh-pages 分支就不再是網站內容,
# update_stocks.yml 的同步步驟會變成空轉 —— 兩套不能同時生效。
# 沒有特別理由的話,維持現狀就好。
#
# 保留它的原因:萬一哪天分支來源出問題,這是現成的另一條路。

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "docs/**"
  #     - ".github/workflows/deploy_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署,但不取消進行中的,避免資料更新的部署被砍掉
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 取得程式碼
        # 不指定 ref:workflow_dispatch 會取觸發時選的那個分支。
        # 這是刻意的 —— 資料更新都在功能分支上,main 停在 9/10,
        # 從 main 部署會把兩週前的版本推上線。
        uses: actions/checkout@v4

      - name: 確認要部署的內容是新的
        run: |
          echo "分支: ${GITHUB_REF_NAME}"
          python3 -c "import json; d=json.load(open('docs/data/stocks.json')); c=json.load(open('docs/data/chips.json')); print('行情最新', d['dates'][-1], len(d['dates']), '天', len(d['stocks']), '檔'); print('籌碼最新', c['dates'][-1], len(c['stocks']), '檔')"
          test -f docs/robots.txt || { echo "缺 robots.txt,不部署"; exit 1; }
          grep -q 'name="robots" content="noindex' docs/index.html || { echo "index.html 沒有 noindex,不部署"; exit 1; }
          echo "noindex 與 robots.txt 都在"

      - name: 設定 Pages(尚未啟用時自動啟用)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包 docs 目錄
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
